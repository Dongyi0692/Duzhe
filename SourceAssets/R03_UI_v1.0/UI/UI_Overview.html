<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渡者 · R03 UI 预览</title>
<style>
@font-face{font-family:Duzhe;src:url("Fonts/NotoSansCJKsc-Regular.otf") format("opentype");font-weight:400;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#101820;color:#eaf0f3;font-family:Duzhe,sans-serif}button,input,select{font:inherit}
header{height:82px;border-bottom:1px solid #344450;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:24px}
header h1{font-size:22px;font-weight:400;margin:0;letter-spacing:3px}header p{font-size:13px;color:#9aadb9;margin:7px 0 0}
.tag{font-size:12px;color:#dcc6a3;letter-spacing:2px}main{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 82px)}
nav{padding:20px 14px;border-right:1px solid #344450;overflow:auto;height:calc(100vh - 82px);position:sticky;top:0}
nav button{width:100%;color:#acbbc5;text-align:left;font-size:13px;background:transparent;border:1px solid transparent;padding:9px 10px;cursor:pointer}
nav button.active{border-color:#637f8f;color:#f0e0c0;background:#263b4b}
.content{padding:22px 26px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:18px;font-size:13px}
.toolbar select{background:#1c2c39;color:#d5e2e9;border:1px solid #465f70;padding:7px}
#screenTitle{font-size:20px;font-weight:400;margin:0}#viewport{width:100%;position:relative;overflow:hidden;box-shadow:0 18px 65px #0006;background:#263544}
#stage{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:top left;overflow:hidden;background:#263544}
.world{position:absolute;inset:0;background:linear-gradient(120deg,#233341,#405968 60%,#243847);pointer-events:none}
.world::after{content:"";position:absolute;right:0;top:0;width:42%;height:100%;background:repeating-linear-gradient(0deg,transparent 0 31px,#91afbf12 31px 33px)}
.scrim{position:absolute;inset:0;background:#08121b55;pointer-events:none}
.control{position:absolute;box-sizing:border-box;color:#eef2f4;font-weight:400}
.copy{white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere;word-break:normal;pointer-events:none}
.panel{border:12px solid transparent;border-image:url("Skins/UI01_GenericPanel.png") 12 fill stretch;pointer-events:none;image-rendering:pixelated}
.btn{padding:0 12px;border:8px solid transparent;border-image:url("Skins/UI01_Button.png") 8 fill stretch;color:#eef2f4;background:transparent;display:flex;align-items:center;justify-content:center;line-height:1.2;cursor:pointer;white-space:normal;text-align:center}
.btn:hover{filter:brightness(1.12)}.btn:active{filter:brightness(.88)}.btn:focus-visible{outline:2px solid #d7bc8d;outline-offset:3px}
.btn[disabled]{opacity:.5;cursor:default}.iconButton{border:0;background:#263544cc;padding:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconButton:hover,.iconButton:focus-visible{outline:2px solid #d7bc8d;outline-offset:1px}
.iconButton img,.icon{width:32px;height:32px;image-rendering:pixelated;object-fit:contain}.icon{pointer-events:none}
.slider{display:flex;gap:12px;align-items:center;color:#b7c5cc}.slider input{width:206px;accent-color:#b7c5cc;height:44px;cursor:pointer}.slider output{font-size:20px;min-width:44px}
.wire{border:1px solid #8fa6b36b;background:#17273388;color:#b7c5cc;display:flex;align-items:center;justify-content:center}
.target{border:2px dashed #d7bc8d;background:#d7bc8d10}.drag{border:2px solid #a0b7c6;background:#536e7f80;cursor:grab}.hinted{outline:3px solid #d7bc8d;outline-offset:4px;color:#ffe4b6}
.itemlist{display:grid;align-content:start}.itemlist .btn{font-size:26px;text-align:left;justify-content:flex-start;padding-left:24px}
#note{font-size:13px;line-height:1.8;color:#91a6b3;margin:16px 0 0}.meta{font-size:12px;color:#708b9c;margin-top:12px}
#notice{color:#d7bc8d;min-height:26px;font-size:13px;margin:10px 0}
body.capture{overflow:hidden}body.capture header,body.capture nav,body.capture .toolbar,body.capture #note,body.capture .meta,body.capture #notice{display:none}
body.capture main{display:block;min-height:0}body.capture .content{padding:0}body.capture #viewport{box-shadow:none;width:100vw;height:100vh!important}

<header><div><h1>渡者 / UI 设计预览</h1><p>R03 · 沿用已确认母图 · 25 个界面 · 真实皮肤与字体</p></div><span class="tag">GREY BLUE · QUIET LIGHT</span></header>

<div id="viewport"><div id="stage"></div></div><div id="notice" aria-live="polite"></div>
<p id="note">可切换界面，查看按钮状态、文字排版与空列表。环境底色、机关轮廓为布局示意；游戏逻辑、正式场景和机关美术由后续任务接入。</p>
<div class="meta">界面文字来自 R01；新增 3 个键单独交付。预览不修改存档，不代表团结引擎内验收。</div></div></main>

const stage=document.getElementById("stage"),nav=document.getElementById("nav"),progress=document.getElementById("progress");

const params=new URLSearchParams(location.search);let current=params.get("screen")||"MainMenu";let last="MainMenu";

function rect(el,r){Object.assign(el.style,{left:r[0]+"px",top:r[1]+"px",width:r[2]+"px",height:r[3]+"px"})}
function msg(t){document.getElementById("notice").textContent=t}
function fit(){const w=document.getElementById("viewport").clientWidth;const scale=w/1280;stage.style.transform="scale("+scale+")";document.getElementById("viewport").style.height=(720*scale)+"px";window.previewScale=scale}
function textOf(c){let t=c.textKey?COPY[c.textKey]:(c.previewText||COPY[c.previewTextKey]||"");
if(c.textBinding==="startLabelByFormalProgress")t=COPY[progress.value==="new"?"menu.start":progress.value==="all"?"menu.replay_first":"menu.continue"];
if(c.previewValues)for(const [k,v]of Object.entries(c.previewValues))t=t.replaceAll("{"+k+"}",v);
if(c.previewSuffix)t+="  "+c.previewSuffix;
return t}
function shouldShow(c){if(c.visibleWhen.includes("count == 0"))return progress.value==="new";if(c.visibleWhen.includes("count > 0"))return progress.value!=="new";return !c.previewHidden}
function shape(type){const start='<svg viewBox="0 0 640 360" width="100%" height="100%" aria-hidden="true" style="pointer-events:none">',end='</svg>';
const attrs='fill="none" stroke="#b7c5cc" stroke-width="7" stroke-linecap="round"';
if(type==="cane")return start+'<path '+attrs+' stroke-dasharray="10 9" d="M245 110 C245 50 345 50 345 110 L345 290"/>'+end;
if(type==="heart")return start+'<path '+attrs+' stroke-dasharray="10 9" d="M320 285 C70 135 240 10 320 120 C400 10 570 135 320 285Z"/>'+end;
if(type==="goodbye")return start+'<text x="320" y="252" fill="#b7c5cc55" text-anchor="middle" font-family="Duzhe" font-size="220">再见</text><path d="M120 101 H275" stroke="#d7bc8d" stroke-width="8"/>'+end;
if(type==="stools")return start+'<rect x="210" y="90" width="220" height="125" rx="4" fill="#536e7f" stroke="#b7c5cc" stroke-width="4"/>'+end;
if(type==="photo")return start+[110,230,470].map(x=>'<circle cx="'+x+'" cy="120" r="32" fill="#718596"/><rect x="'+(x-35)+'" y="157" width="70" height="115" fill="#718596"/>').join("")+end;
if(type==="door")return start+'<path d="M50 340 V35 H590 V340 M320 35 V340" '+attrs+'/>'+end;
if(type==="knocker")return '<svg viewBox="0 0 88 96" width="100%" height="100%"><rect x="36" y="8" width="16" height="20" fill="#d7bc8d"/><circle cx="44" cy="53" r="22" fill="none" stroke="#d7bc8d" stroke-width="7"/></svg>';
if(type==="stool")return '<svg viewBox="0 0 72 72" width="100%" height="100%"><path d="M12 18 H60 V34 H12Z M20 34 V60 M52 34 V60" stroke="#b7c5cc" fill="#718596" stroke-width="6"/></svg>';
if(type==="person")return '<svg viewBox="0 0 96 144" width="100%" height="100%"><circle cx="48" cy="35" r="24" fill="#b7c5cc"/><rect x="22" y="65" width="52" height="66" fill="#718596"/></svg>';
return ""}
function act(c){const a=c.action;const targets={OpenChapters:"Chapters",OpenGallery:"Gallery",OpenSettings:"Settings",OpenCredits:"Credits",OpenPause:"Pause",ConfirmQuit:"ConfirmQuit",ConfirmLeaveChapter:"ConfirmLeave",ConfirmLeaveGallery:"ConfirmGalleryExit",StartOrContinue:"Explore",RetryCurrentRiver:"RiverActive",StartRiver:"RiverActive"};
if(targets[a]){last=current;show(targets[a]);return}
if(["BackToCaller","CloseSettingsSaveVolumes"].includes(a)){show(["Pause","MainMenu"].includes(last)?last:"MainMenu");return}
if(a==="Resume"){show("Explore");return}
if(a==="CloseMinigame"){show("Explore");return}
if(a==="CancelModal"){show(last==="MainMenu"?"MainMenu":"Pause");return}
if(["ConfirmPendingLeave","QuitGame","QuitWithoutOverwritingSave","ReturnToMenuAfterEnding"].includes(a)){show("MainMenu");msg("设计预览：已返回主菜单；没有操作真实游戏或存档。");return}
if(a==="LeaveGalleryReplay"){show("Gallery");return}
if(a==="ConfirmPendingReplay"){show("Dialogue");return}
if(a==="PlayNote"){msg("预览操作：音符 "+c.noteIndex+"。正式音序由 Codely 和 R15 配置接入。");return}
if(a==="PlayNoteDemo"){msg("示范按钮位置与状态预览；正式示范音频由 R15 交付。");return}
msg("预览操作："+a+"。游戏流程由 Codely 接入。")}
function show(sid){current=sid;const s=LAYOUT.screens.find(s=>s.screenId===sid);if(!s)return;
stage.innerHTML='<div class="world"></div>'+(s.layer>=40?'<div class="scrim"></div>':"");
stage.dataset.screen=sid;document.getElementById("screenTitle").textContent=s.name;

for(const c of s.controls){if(!shouldShow(c))continue;let el=document.createElement(c.kind==="Button"?"button":"div");el.className="control";el.dataset.control=c.controlId;rect(el,c.rect);
el.style.fontSize=c.fontSize+"px";el.style.lineHeight=c.lineHeight;el.title=c.controlId;
if(c.kind==="Panel"){el.classList.add("panel");if(c.assetId==="UI01_DialoguePanel")el.style.borderImageSource='url("Skins/UI01_DialoguePanel.png")'}
else if(c.kind==="Text"){el.classList.add("copy");el.textContent=textOf(c);if(c.color==="accent")el.style.color="#d7bc8d"}
else if(c.kind==="Button"){if(c.assetId.startsWith("UI02")){el.classList.add("iconButton");el.innerHTML='<img src="Icons/'+c.assetId+'.png" alt="">';el.setAttribute("aria-label",COPY[c.accessibleTextKey]||"按钮")}
else{el.classList.add("btn");el.textContent=textOf(c);if(c.previewEmphasis)el.classList.add("hinted")}

else if(c.kind==="Icon"){el.innerHTML='<img class="icon" src="Icons/'+c.assetId+'.png" alt="">'}
else if(c.kind==="Slider"){el.classList.add("slider");const input=document.createElement("input");input.type="range";input.min=0;input.max=1;input.step=.05;input.value=c.value;input.setAttribute("aria-label",COPY[c.accessibleTextKey]);const out=document.createElement("output");out.textContent=Math.round(c.value*100)+"%";input.oninput=()=>out.textContent=Math.round(input.value*100)+"%";el.append(input,out)}

let keys=c.previewItems;if(progress.value==="all"){keys=c.dataSource==="completedFormalChapters"?["CH01","CH02","CH03","CH04","CH05"].map(x=>"chapter."+x+".name"):["PR_CH01_Farewell","PR_CH02_Farewell","PR_CH03_Farewell","PR_CH04_Farewell","PR_CH05_Recall","PR_CH05_Reincarnation"].map(x=>"gallery."+x+".title")}
keys.forEach(k=>{const b=document.createElement("button");b.className="btn";b.style.width=c.itemSize[0]+"px";b.style.height=c.itemSize[1]+"px";b.textContent=COPY[k];b.onclick=()=>{last=sid;show(sid==="Chapters"?"ConfirmReplay":"GalleryReplay")};el.append(b)})}
else if(["InteractionArea","PreviewArea","DropTarget","DragSource"].includes(c.kind)){el.classList.add("wire");if(c.kind==="DropTarget")el.classList.add("target");if(c.kind==="DragSource")el.classList.add("drag");el.innerHTML=shape(c.previewShape||"");if(c.action!=="None")el.addEventListener("click",()=>act(c))}

for(const s of LAYOUT.screens){let b=document.createElement("button");b.textContent=s.name;b.dataset.screen=s.screenId;b.onclick=()=>{last=current;show(s.screenId);msg("")};nav.append(b)}
